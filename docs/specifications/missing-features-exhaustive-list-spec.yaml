        - :r file - read file
        - :! command - shell command
        - :.! command - filter through command
        - :1,10d - delete lines 1-10
        - :g/pattern/d - global delete

      implementation_notes: |
        - Current: basic ex commands (userspace/src/vim/ex_commands.rs)
        - Extend with more commands

      test_requirements:
        unit_tests: 15
        property_tests: 3
        integration_tests: 8

      code_references:
        - "userspace/src/vim/ex_commands.rs"

