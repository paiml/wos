        - Faster than network sockets (no protocol overhead)

      test_requirements:
        unit_tests: 12
        property_tests: 3
        integration_tests: 7

    - id: "WOS-NET-007"
      title: "Network Utilities (ping, netstat, ifconfig)"
      priority: "P3-Low"
      effort_days: 3
      dependencies: ["WOS-NET-001", "WOS-NET-004"]
      description: |
