networking_features:
  description: "Network stack for inter-process and inter-system communication"
  total_tickets: 8
  estimated_weeks: 4

  tickets:
    - id: "WOS-NET-001"
      title: "Socket API (socket, bind, listen, accept)"
      priority: "P2-Medium"
      effort_days: 6
      dependencies: []
      description: |
        POSIX socket API for network communication.

      acceptance_criteria:
        - socket() creates endpoint
        - bind() assigns address
        - listen() marks as passive socket
        - accept() accepts connection
        - connect() initiates connection
        - send()/recv() data transfer

      implementation_notes: |
        - Socket as special file descriptor type
        - Socket state machine: UNBOUND -> BOUND -> LISTENING -> CONNECTED
        - Virtual network stack (no real network in WASM)

      test_requirements:
        unit_tests: 20
        property_tests: 5
        integration_tests: 12

    - id: "WOS-NET-002"
      title: "TCP Protocol Implementation"
      priority: "P2-Medium"
      effort_days: 8
      dependencies: ["WOS-NET-001"]
      description: |
        Reliable byte stream protocol.

      acceptance_criteria:
        - Three-way handshake (SYN, SYN-ACK, ACK)
        - Sequence numbers and acknowledgments
        - Retransmission on timeout
        - Flow control (sliding window)
        - Connection termination (FIN)

      test_requirements:
        unit_tests: 25
        property_tests: 6
        integration_tests: 15

    - id: "WOS-NET-003"
      title: "UDP Protocol Implementation"
      priority: "P2-Medium"
      effort_days: 4
      dependencies: ["WOS-NET-001"]
      description: |
        Unreliable datagram protocol.

      acceptance_criteria:
        - sendto()/recvfrom() for datagrams
        - No connection establishment
        - Best-effort delivery
        - Checksum validation

      test_requirements:
        unit_tests: 12
        property_tests: 3
        integration_tests: 6

    - id: "WOS-NET-004"
      title: "IP Routing and Addressing"
      priority: "P3-Low"
      effort_days: 5
      dependencies: []
      description: |
