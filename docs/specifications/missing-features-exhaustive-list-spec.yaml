educational_value:
  description: "How each feature enhances OS learning outcomes"

  concepts_taught:
    process_management:
      tickets: [WOS-KERN-001, WOS-KERN-003, WOS-KERN-004, WOS-KERN-009]
      learning_outcomes:
        - Understand process lifecycle (create, run, block, terminate)
        - Learn signal-based asynchronous communication
        - Explore process scheduling algorithms
        - Experience process groups and sessions for job control

    memory_management:
      tickets: [WOS-KERN-005, WOS-KERN-006, WOS-KERN-007, WOS-KERN-008]
      learning_outcomes:
        - Understand virtual memory and address spaces
        - Learn page-based memory organization
        - Explore shared memory IPC
        - Experience copy-on-write optimization

    file_systems:
      tickets: [WOS-FS-001, WOS-FS-002, WOS-FS-003, WOS-FS-004]
      learning_outcomes:
        - Understand hierarchical directory structure
        - Learn inode-based file systems
        - Explore hard links vs symbolic links
        - Experience UNIX permissions model

    concurrency:
      tickets: [WOS-KERN-011, WOS-KERN-014, WOS-NET-001, WOS-NET-002]
      learning_outcomes:
        - Understand non-blocking I/O
        - Learn asynchronous event handling
        - Explore race conditions and synchronization
        - Experience concurrent programming challenges

    networking:
      tickets: [WOS-NET-001, WOS-NET-002, WOS-NET-003, WOS-NET-006]
      learning_outcomes:
        - Understand socket abstraction
        - Learn TCP protocol (connection, reliability, flow control)
        - Explore UDP datagram communication
        - Experience network programming APIs

    security:
      tickets: [WOS-SEC-001, WOS-SEC-004, WOS-SEC-006, WOS-SEC-008]
      learning_outcomes:
        - Understand authentication and authorization
        - Learn privilege separation
        - Explore sandboxing techniques
        - Experience security policy enforcement

