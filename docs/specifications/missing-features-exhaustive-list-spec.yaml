# WOS Missing Features - Exhaustive Implementation Specification
# Version: 1.0
# Date: 2025-01-16
# Status: Comprehensive Feature Gap Analysis
# Purpose: Ticket-by-ticket guide to complete WOS core OS features

metadata:
  version: "1.0"
  created: "2025-01-16"
  last_updated: "2025-01-16"
  status: "specification"
  total_tickets: 87
  estimated_weeks: 24
  priority_levels: ["P0-Critical", "P1-High", "P2-Medium", "P3-Low"]

executive_summary: |
  This specification provides a comprehensive, ticket-by-ticket implementation guide
  for completing WOS as a full-featured educational operating system. Based on systematic
  codebase analysis, we identified 87 missing features across 8 core subsystems.

  Current Status (2025-01-16):
  - ✅ 219 tests passing
  - ✅ 14 syscalls implemented
  - ✅ Core microkernel complete (scheduler, memory, IPC)
  - ✅ Basic userspace (4 programs, 6 shell builtins)
  - ⚠️  Missing: 60+ features for production-grade OS

  Implementation Priority:
  1. File System Enhancement (directories, symlinks, permissions)
  2. Signal Handling & Process Control
  3. Shell Scripting (control flow, functions)
  4. Additional User Programs (cat, grep, sed, awk, etc.)
  5. Advanced Vim Features (search, text objects, macros)
  6. Networking Stack (sockets, TCP/UDP)
  7. Terminal Emulation (full ANSI, colors, mouse)
  8. Multi-user Support (users, groups, permissions)

# ==============================================================================
# SUBSYSTEM 1: KERNEL - PROCESS & MEMORY MANAGEMENT
# ==============================================================================

kernel_features:
  description: "Core kernel enhancements for production-grade process and memory management"
  total_tickets: 18
  estimated_weeks: 6

  tickets:
    - id: "WOS-KERN-001"
      title: "Implement Signal Handling System"
      priority: "P0-Critical"
      effort_days: 5
      dependencies: []
      description: |
        Implement POSIX-like signal handling for process communication and control.
        Signals enable asynchronous event notification (user interrupts, errors, IPC).

      acceptance_criteria:
        - Signal types defined (SIGINT, SIGTERM, SIGKILL, SIGUSR1, SIGUSR2, SIGCHLD, SIGSEGV, SIGPIPE)
        - kill() syscall sends signals to processes
        - Signal handlers registered via signal() or sigaction() syscall
        - Default signal handlers (TERM, KILL, IGNORE)
        - Signal masks for blocking/unblocking signals
        - Signal delivery during process scheduling
        - Pending signals queue per process
        - Property tests: signal delivery correctness, no signal loss

      implementation_notes: |
        - Add SignalSet to Process struct (pending, blocked)
        - Add signal handler table to Process
        - Modify scheduler to deliver pending signals before running process
        - SIGKILL and SIGSTOP cannot be caught or ignored
        - SIGCHLD sent to parent when child terminates

      test_requirements:
        unit_tests: 15
        property_tests: 3
        integration_tests: 5

      related_papers:
        - "Signal Handling in Operating Systems (Vahalia, 1996)"

    - id: "WOS-KERN-002"
      title: "Implement Sleep Syscall"
      priority: "P1-High"
      effort_days: 2
      dependencies: []
      description: |
        Currently returns NotImplemented. Implement process sleeping with timeout.

      acceptance_criteria:
        - Sleep(duration_ms) syscall implemented
        - Process transitions to Blocked(Sleeping) state
        - Simulated clock tracks wakeup time
        - Scheduler wakes processes when duration elapses
        - Property test: sleep duration accuracy within tolerance

      implementation_notes: |
        - Add Sleeping variant to BlockReason enum
        - Add wakeup_time field to Process
        - Scheduler checks wakeup times each tick
        - Use simulated clock from shared/context.rs

      test_requirements:
        unit_tests: 8
        property_tests: 2
        integration_tests: 3

    - id: "WOS-KERN-003"
      title: "Process Priority and Scheduling Classes"
      priority: "P2-Medium"
      effort_days: 4
      dependencies: []
      description: |
        Add priority-based scheduling (nice values) and scheduling classes
        (real-time, interactive, batch).

      acceptance_criteria:
        - Process priority field (nice value -20 to +19)
        - Setpriority/getpriority syscalls
        - Modified scheduler respects priorities
        - Scheduling classes: SCHED_FIFO, SCHED_RR, SCHED_OTHER
        - Property test: higher priority processes get more CPU time

      implementation_notes: |
        - Add priority field to Process
        - Modify scheduler to use priority queue instead of FIFO
        - Real-time processes preempt normal processes
        - Time quantum varies by priority

      test_requirements:
        unit_tests: 12
        property_tests: 4
        integration_tests: 4

    - id: "WOS-KERN-004"
      title: "Process Groups and Sessions"
      priority: "P2-Medium"
      effort_days: 3
      dependencies: []
      description: |
        Implement process groups (PGID) and sessions (SID) for job control.

      acceptance_criteria:
        - Process group ID (PGID) per process
        - Session ID (SID) per process
        - setpgid(), getpgid(), setsid() syscalls
        - killpg() to signal entire process group
        - Session leader and process group leader concepts

      implementation_notes: |
        - Add pgid and sid fields to Process
        - Process group is collection of related processes
        - Session is collection of process groups
        - Used for job control (fg/bg in shell)

      test_requirements:
        unit_tests: 10
        property_tests: 2
        integration_tests: 6

    - id: "WOS-KERN-005"
      title: "Memory Protection and Permissions"
      priority: "P1-High"
      effort_days: 4
      dependencies: []
      description: |
        Enforce memory permissions (read, write, execute) during memory access.

      acceptance_criteria:
        - Memory pages have RWX permission bits
        - mprotect() syscall changes page permissions
        - Attempted violations raise SIGSEGV
        - Code pages are read-only + execute
        - Stack/heap pages are no-execute (NX bit)
        - Property test: permission violations detected

      implementation_notes: |
        - Permissions already in PageTableEntry (memory.rs:21)
        - Add permission checking to memory access functions
        - Raise SIGSEGV on violation (requires WOS-KERN-001)
        - Code pages: R+X, Data: R+W, Stack/Heap: R+W (no X)

      test_requirements:
        unit_tests: 14
        property_tests: 3
        integration_tests: 5

    - id: "WOS-KERN-006"
      title: "Shared Memory (SHM) IPC"
      priority: "P2-Medium"
      effort_days: 5
      dependencies: ["WOS-KERN-005"]
      description: |
        Implement shared memory regions for fast inter-process communication.

      acceptance_criteria:
        - shmget() creates shared memory segment
        - shmat() attaches segment to process address space
        - shmdt() detaches segment
        - shmctl() controls segment (destroy, get info)
        - Multiple processes can map same physical memory
        - Property test: changes in one process visible in another

      implementation_notes: |
        - Add SharedMemorySegment type (id, size, permissions)
        - Add SHM table to KernelState
        - Map same PhysicalPage to multiple processes' VirtualMemory
        - Reference counting for segment lifetime

      test_requirements:
        unit_tests: 12
        property_tests: 4
        integration_tests: 8

    - id: "WOS-KERN-007"
      title: "Memory-Mapped Files (mmap)"
      priority: "P2-Medium"
      effort_days: 4
      dependencies: ["WOS-KERN-005"]
      description: |
        Support file-backed memory mappings for efficient file I/O.

      acceptance_criteria:
        - mmap() with file descriptor maps file to memory
        - Changes to memory reflected in file (MAP_SHARED)
        - Private mappings copy-on-write (MAP_PRIVATE)
        - munmap() unmaps region
        - msync() flushes changes to file

      implementation_notes: |
        - Add file_backed flag to VirtualMemory
        - Track mapping: virtual page -> (file, offset)
        - Lazy loading: page fault loads data on first access
        - Writeback on munmap or msync

      test_requirements:
        unit_tests: 15
        property_tests: 3
        integration_tests: 6

    - id: "WOS-KERN-008"
      title: "Copy-on-Write (COW) Fork"
      priority: "P2-Medium"
      effort_days: 5
      dependencies: []
      description: |
        Optimize fork() using copy-on-write memory sharing.

      acceptance_criteria:
        - Parent and child share read-only pages after fork
        - Write triggers page copy (copy-on-write)
        - Significant memory savings for large processes
        - Property test: parent/child memory isolated after write

      implementation_notes: |
        - Mark pages as copy-on-write in page table
        - Reference count shared pages
        - On write to COW page, copy to new physical page
        - Update page table to point to new page

      test_requirements:
        unit_tests: 12
        property_tests: 5
        integration_tests: 4

    - id: "WOS-KERN-009"
      title: "Exec Syscall Implementation"
      priority: "P1-High"
      effort_days: 4
      dependencies: []
      description: |
        Implement exec() family (execve) to replace process image.

      acceptance_criteria:
        - execve(path, args, env) replaces current process
        - PID remains same, memory/file descriptors replaced
        - Loads new program from VFS
        - Closes all non-CLOEXEC file descriptors
        - Resets signal handlers to default
        - Property test: process state fully replaced

      implementation_notes: |
        - Currently documented (wos-spec-v1.md:267) but not implemented
        - Replace process memory with new program
        - Reset stack, heap, code segments
        - Preserve PID, PPID, open files (unless CLOEXEC)

      test_requirements:
        unit_tests: 10
        property_tests: 3
        integration_tests: 7

    - id: "WOS-KERN-010"
      title: "File Descriptor Flags (FD_CLOEXEC)"
      priority: "P2-Medium"
      effort_days: 2
      dependencies: ["WOS-KERN-009"]
      description: |
        Support close-on-exec flag for file descriptors.

      acceptance_criteria:
        - fcntl(F_GETFD, F_SETFD) syscalls
        - FD_CLOEXEC flag per file descriptor
        - exec() closes FDs with CLOEXEC set
        - Property test: CLOEXEC FDs not inherited

      test_requirements:
        unit_tests: 8
        property_tests: 2
        integration_tests: 4

    - id: "WOS-KERN-011"
      title: "Non-blocking I/O and Select/Poll"
      priority: "P2-Medium"
      effort_days: 5
      dependencies: []
      description: |
        Support non-blocking file descriptors and I/O multiplexing.

      acceptance_criteria:
        - O_NONBLOCK flag for open()
        - fcntl() to set/clear O_NONBLOCK
        - Read/write return EWOULDBLOCK if no data ready
        - select() syscall monitors multiple FDs
        - poll() syscall alternative to select

      implementation_notes: |
        - Add nonblocking flag to FileHandle
        - Modify read/write to check data availability
        - select/poll maintain readiness sets
        - Scheduler wakes process when FD ready

      test_requirements:
        unit_tests: 15
        property_tests: 4
        integration_tests: 8

    - id: "WOS-KERN-012"
      title: "Asynchronous I/O (AIO)"
      priority: "P3-Low"
      effort_days: 6
      dependencies: ["WOS-KERN-011"]
      description: |
        Implement POSIX asynchronous I/O for concurrent operations.

      acceptance_criteria:
        - aio_read(), aio_write() submit async operations
        - aio_error() checks operation status
        - aio_return() retrieves result
        - Completion notifications via signals or callbacks

      test_requirements:
        unit_tests: 12
        property_tests: 3
        integration_tests: 6

    - id: "WOS-KERN-013"
      title: "Resource Limits (rlimit)"
      priority: "P2-Medium"
      effort_days: 3
      dependencies: []
      description: |
        Implement per-process resource limits.

      acceptance_criteria:
        - getrlimit(), setrlimit() syscalls
        - Limits: CPU time, memory, open files, processes
        - RLIMIT_CPU, RLIMIT_AS, RLIMIT_NOFILE, RLIMIT_NPROC
        - Enforcement: operations fail if limit exceeded
        - Property test: limits enforced correctly

      implementation_notes: |
        - Add rlimits field to Process
        - Check limits before allocation/fork/open
        - Raise SIGXCPU when CPU limit exceeded

      test_requirements:
        unit_tests: 10
        property_tests: 3
        integration_tests: 5

    - id: "WOS-KERN-014"
      title: "Kernel Threads and Work Queues"
      priority: "P3-Low"
      effort_days: 5
      dependencies: []
      description: |
        Implement kernel-level threads for background work.

      acceptance_criteria:
        - Kernel thread creation/management
        - Work queue abstraction
        - Deferred work execution
        - Used for async I/O, timers, cleanup

      test_requirements:
        unit_tests: 12
        property_tests: 2
        integration_tests: 4

    - id: "WOS-KERN-015"
      title: "Process Capabilities (Linux-style)"
      priority: "P3-Low"
      effort_days: 4
      dependencies: []
      description: |
        Fine-grained privilege separation using capabilities.

      acceptance_criteria:
        - Capability set per process (permitted, effective, inheritable)
        - Capabilities: CAP_NET_ADMIN, CAP_SYS_ADMIN, CAP_KILL, etc.
        - capget(), capset() syscalls
        - Permission checks use capabilities, not just UID

      test_requirements:
        unit_tests: 10
        property_tests: 3
        integration_tests: 5

    - id: "WOS-KERN-016"
      title: "Namespaces for Isolation"
      priority: "P3-Low"
      effort_days: 6
      dependencies: []
      description: |
        Implement Linux-style namespaces (PID, mount, network, user).

      acceptance_criteria:
        - unshare() creates new namespace
        - setns() enters existing namespace
        - clone() with CLONE_NEWNS, CLONE_NEWPID, etc.
        - Isolated views of system resources

      test_requirements:
        unit_tests: 15
        property_tests: 4
        integration_tests: 8

    - id: "WOS-KERN-017"
      title: "Control Groups (cgroups) for Resource Control"
      priority: "P3-Low"
      effort_days: 7
      dependencies: ["WOS-KERN-013"]
      description: |
        Hierarchical resource management using control groups.

      acceptance_criteria:
        - Cgroup filesystem interface
        - Resource controllers: CPU, memory, I/O
        - Process assignment to cgroups
        - Limit enforcement per cgroup

      test_requirements:
        unit_tests: 18
        property_tests: 5
        integration_tests: 10

    - id: "WOS-KERN-018"
      title: "Kernel Tracing and Profiling (eBPF-style)"
      priority: "P3-Low"
      effort_days: 8
      dependencies: []
      description: |
        Dynamic kernel instrumentation for performance analysis.

      acceptance_criteria:
        - Tracepoint registration
        - Safe in-kernel program execution
        - Performance counters
        - Event filtering and aggregation

      test_requirements:
        unit_tests: 20
        property_tests: 4
        integration_tests: 12

# ==============================================================================
# SUBSYSTEM 2: FILE SYSTEM
# ==============================================================================

filesystem_features:
  description: "Hierarchical filesystem with directories, symlinks, and permissions"
  total_tickets: 15
  estimated_weeks: 5

  tickets:
    - id: "WOS-FS-001"
      title: "Directory Support in VFS"
      priority: "P0-Critical"
      effort_days: 5
      dependencies: []
      description: |
        Current VFS is flat (files only). Add hierarchical directory structure.

      acceptance_criteria:
        - Directory entries (directories contain files/subdirectories)
        - mkdir() syscall creates directories
        - rmdir() removes empty directories
        - opendir(), readdir(), closedir() for directory traversal
        - Path resolution with directories (e.g., /home/user/file.txt)
        - Property test: directory tree operations consistent

      implementation_notes: |
        - Modify VirtualFileSystem to support directory nodes
        - DirEntry type: name + inode + type (file/dir/symlink)
        - Inode structure: metadata + data/children
        - Path resolution walks directory tree

      test_requirements:
        unit_tests: 20
        property_tests: 5
        integration_tests: 10

      code_references:
        - "shared/src/vfs.rs:1-180"

    - id: "WOS-FS-002"
      title: "Symbolic Links (Symlinks)"
      priority: "P1-High"
      effort_days: 3
      dependencies: ["WOS-FS-001"]
      description: |
        Support symbolic links for flexible file system structure.

      acceptance_criteria:
        - symlink() creates symbolic link
        - readlink() reads link target
        - lstat() vs stat() (follow vs don't follow links)
        - Path resolution follows symlinks (with loop detection)
        - Property test: symlink loops detected, max depth enforced

      implementation_notes: |
        - Add Symlink variant to DirEntry type
        - Store target path in symlink inode
        - Path resolution follows symlinks recursively
        - Limit depth to prevent infinite loops (e.g., 40 max)

      test_requirements:
        unit_tests: 12
        property_tests: 4
        integration_tests: 6

    - id: "WOS-FS-003"
      title: "Hard Links and Inode Reference Counting"
      priority: "P2-Medium"
      effort_days: 3
      dependencies: ["WOS-FS-001"]
      description: |
        Multiple directory entries pointing to same inode.

      acceptance_criteria:
        - link() creates hard link
        - unlink() decrements reference count
        - File deleted only when refcount reaches 0
        - Property test: hard links share inode, refcount correct

      implementation_notes: |
        - Add refcount to inode
        - link() increments refcount, adds DirEntry
        - unlink() decrements refcount, removes DirEntry
        - Free inode when refcount == 0

      test_requirements:
        unit_tests: 10
        property_tests: 3
        integration_tests: 5

    - id: "WOS-FS-004"
      title: "File Permissions and Ownership"
      priority: "P1-High"
      effort_days: 4
      dependencies: ["WOS-FS-001"]
      description: |
        UNIX-style permissions (user, group, other) and ownership.

      acceptance_criteria:
        - File mode bits: rwxrwxrwx (owner, group, other)
        - UID/GID per file
        - chmod() changes permissions
        - chown() changes ownership
        - Permission checks on open/read/write/exec
        - Property test: permission enforcement correct

      implementation_notes: |
        - Add mode, uid, gid to inode
        - Check permissions before file operations
        - Special bits: setuid, setgid, sticky
        - Root (UID 0) bypasses checks

      test_requirements:
        unit_tests: 15
        property_tests: 4
        integration_tests: 8

    - id: "WOS-FS-005"
      title: "File Metadata (stat, timestamps)"
      priority: "P1-High"
      effort_days: 2
      dependencies: ["WOS-FS-001"]
      description: |
        Track file metadata: size, timestamps, type.

      acceptance_criteria:
        - stat() syscall returns file metadata
        - Timestamps: atime, mtime, ctime
        - File type: regular, directory, symlink, device
        - File size in bytes
        - Property test: timestamps updated correctly

      implementation_notes: |
        - Expand inode with metadata fields
        - Update timestamps on operations:
          - atime on read
          - mtime on write
          - ctime on metadata change

      test_requirements:
        unit_tests: 10
        property_tests: 3
        integration_tests: 4

    - id: "WOS-FS-006"
      title: "Path Normalization and Resolution"
      priority: "P1-High"
      effort_days: 3
      dependencies: ["WOS-FS-001", "WOS-FS-002"]
      description: |
        Robust path resolution handling . (current), .. (parent), symlinks.

      acceptance_criteria:
        - Resolve . (current directory)
        - Resolve .. (parent directory)
        - Handle // (multiple slashes)
        - Canonicalize paths (remove redundant components)
        - Absolute vs relative path handling
        - Property test: path resolution deterministic

      implementation_notes: |
        - Path components: split by /
        - Walk directory tree, handle . and ..
        - Follow symlinks (with loop detection)
        - Return canonical absolute path

      test_requirements:
        unit_tests: 15
        property_tests: 5
        integration_tests: 6

    - id: "WOS-FS-007"
      title: "File Locking (flock, fcntl)"
      priority: "P2-Medium"
      effort_days: 4
      dependencies: ["WOS-FS-001"]
      description: |
        Advisory and mandatory file locking.

      acceptance_criteria:
        - flock() for whole-file advisory locks
        - fcntl() for byte-range locks
        - Shared (read) vs exclusive (write) locks
        - Deadlock detection

      test_requirements:
        unit_tests: 12
        property_tests: 4
        integration_tests: 7

    - id: "WOS-FS-008"
      title: "Mount Points and Multiple File Systems"
      priority: "P2-Medium"
      effort_days: 5
      dependencies: ["WOS-FS-001"]
      description: |
        Support mounting different file systems at paths.

      acceptance_criteria:
        - mount() syscall mounts filesystem at path
        - umount() unmounts
        - VFS layer routes operations to correct filesystem
        - /proc, /dev, /tmp as separate mounts

      implementation_notes: |
        - Already partially implemented (wos-spec-v1.md:305-310)
        - Expand to support dynamic mounting
        - Track mount points in kernel state

      test_requirements:
        unit_tests: 15
        property_tests: 3
        integration_tests: 8

    - id: "WOS-FS-009"
      title: "Extended Attributes (xattr)"
      priority: "P3-Low"
      effort_days: 3
      dependencies: ["WOS-FS-001"]
      description: |
        Store arbitrary metadata on files.

      acceptance_criteria:
        - setxattr(), getxattr(), listxattr(), removexattr()
        - Namespace support: user, system, security
        - Used for ACLs, security labels, user metadata

      test_requirements:
        unit_tests: 10
        property_tests: 2
        integration_tests: 4

    - id: "WOS-FS-010"
      title: "Access Control Lists (ACLs)"
      priority: "P3-Low"
      effort_days: 4
      dependencies: ["WOS-FS-004", "WOS-FS-009"]
      description: |
        Fine-grained permissions beyond traditional UNIX model.

      acceptance_criteria:
        - Per-user and per-group permissions
        - Default ACLs for directories
        - getfacl(), setfacl() interface
        - Stored as extended attributes

      test_requirements:
        unit_tests: 12
        property_tests: 3
        integration_tests: 6

    - id: "WOS-FS-011"
      title: "Inotify - File System Event Monitoring"
      priority: "P3-Low"
      effort_days: 4
      dependencies: ["WOS-FS-001"]
      description: |
        Monitor file system changes (create, modify, delete).

      acceptance_criteria:
        - inotify_init(), inotify_add_watch(), inotify_rm_watch()
        - Events: CREATE, MODIFY, DELETE, MOVE, OPEN, CLOSE
        - Watches on files and directories
        - Event queue per watch descriptor

      test_requirements:
        unit_tests: 15
        property_tests: 4
        integration_tests: 8

    - id: "WOS-FS-012"
      title: "File System Quotas"
      priority: "P3-Low"
      effort_days: 3
      dependencies: ["WOS-FS-001", "WOS-FS-004"]
      description: |
        Per-user and per-group disk space limits.

      acceptance_criteria:
        - Block and inode quotas
        - quotactl() syscall
        - Hard and soft limits
        - Grace periods

      test_requirements:
        unit_tests: 10
        property_tests: 3
        integration_tests: 5

    - id: "WOS-FS-013"
      title: "ProcFS Enhancements"
      priority: "P2-Medium"
      effort_days: 3
      dependencies: []
      description: |
        Expand /proc with more process information.

      acceptance_criteria:
        - /proc/PID/fd/ - Open file descriptors
        - /proc/PID/environ - Environment variables
        - /proc/PID/cwd - Current working directory (symlink)
        - /proc/PID/exe - Executable path (symlink)
        - /proc/meminfo - System memory info
        - /proc/cpuinfo - CPU information

      implementation_notes: |
        - Current: /proc/PID/status, /proc/PID/cmdline (syscall.rs:850-900)
        - Add dynamic content generation for new entries

      test_requirements:
        unit_tests: 12
        property_tests: 2
        integration_tests: 6

      code_references:
        - "kernel/src/syscall.rs:850-900"

    - id: "WOS-FS-014"
      title: "DevFS Virtual Devices"
      priority: "P2-Medium"
      effort_days: 4
      dependencies: ["WOS-FS-001"]
      description: |
        Expand /dev with more virtual devices.

      acceptance_criteria:
        - /dev/null - Discard all writes, read returns EOF
        - /dev/zero - Read infinite zeros
        - /dev/random - Random bytes
        - /dev/urandom - Pseudo-random bytes (faster)
        - /dev/full - Writes fail with ENOSPC
        - /dev/tty - Controlling terminal

      implementation_notes: |
        - Device special files in VFS
        - Read/write operations dispatch to device handlers
        - Use ChaCha8 RNG from shared/context.rs for random

      test_requirements:
        unit_tests: 15
        property_tests: 3
        integration_tests: 7

    - id: "WOS-FS-015"
      title: "Filesystem Journaling and Consistency"
      priority: "P3-Low"
      effort_days: 6
      dependencies: ["WOS-FS-001"]
      description: |
        Ensure filesystem consistency after crashes.

      acceptance_criteria:
        - Write-ahead logging (journaling)
        - Atomic operations (all-or-nothing)
        - fsync() forces writes to stable storage
        - Recovery on mount after crash

      test_requirements:
        unit_tests: 18
        property_tests: 5
        integration_tests: 10

# ==============================================================================
# SUBSYSTEM 3: SHELL & SCRIPTING
# ==============================================================================

shell_features:
  description: "Full-featured shell with scripting, job control, and advanced features"
  total_tickets: 16
  estimated_weeks: 5

  tickets:
    - id: "WOS-SHELL-001"
      title: "Shell Control Flow - If/Else"
      priority: "P0-Critical"
      effort_days: 4
      dependencies: []
      description: |
        Implement if/elif/else conditional execution.

      acceptance_criteria:
        - if condition; then commands; fi syntax
        - elif and else branches
        - Condition evaluation via exit codes
        - test command or [ ] for conditions
        - Nested if statements

      implementation_notes: |
        - Parser recognizes if/then/elif/else/fi keywords
        - Evaluate condition, execute branch based on exit code
        - AST node for conditional statements

      test_requirements:
