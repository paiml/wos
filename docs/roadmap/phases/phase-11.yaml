          OUTCOME: Tests did NOT improve mutation kill rate (still 81.0% for wos/ crate).

          ROOT CAUSE: Black-box tests cannot catch equivalent mutants in unreachable code paths.
          Example: parse_assignment lines 172-183 always return None when operators present,
          regardless of internal quote detection logic - mutations in quote detection don't
          change observable behavior.

