[workspace]
resolver = "2"
members = [
    "shared",
    "kernel",
    "userspace",
    "wos",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Noah Gift <noah.gift@gmail.com>"]
license = "MIT"
repository = "https://github.com/noahgift/wos"

[workspace.dependencies]
# Persistent data structures (O(1) clone)
im = { version = "15.1", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Deterministic RNG
rand = "0.8"
rand_chacha = "0.3"
getrandom = { version = "0.2", features = ["js"] }

# Error handling
thiserror = "1.0"

# WASM bindings
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

# Testing
proptest = "1.4"

# NOTE: tree-sitter for syntax highlighting will be added in future
# Currently blocked by WASM compilation issues with C dependencies

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
