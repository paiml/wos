      - "Exec system call (WOS-026)"
      - "Signals (WOS-027)"
      - "Pipes and redirection (WOS-028)"
      - "Multi-core support (WOS-029)"
      - "Debugging tools (WOS-030)"
      - "Special filesystems (DevFS, TmpFS)"
      - "Shared memory IPC (WOS-013)"
      - "Synchronization primitives (WOS-014)"

