[package]
name = "wos-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust/WASM UI for WOS - Zero JavaScript"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wasm"]
wasm = ["wasm-bindgen", "web-sys", "js-sys", "console_error_panic_hook"]

[dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlDivElement",
    "HtmlTextAreaElement",
    "HtmlButtonElement",
    "HtmlSelectElement",
    "HtmlOptionElement",
    "Window",
    "Storage",
    "Location",
    "Url",
    "UrlSearchParams",
    "Node",
    "NodeList",
    "Text",
    "Event",
    "KeyboardEvent",
    "MouseEvent",
    "InputEvent",
    "FocusEvent",
    "EventTarget",
    "AddEventListenerOptions",
    "DomTokenList",
    "CssStyleDeclaration",
    "Performance",
    "History",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "Selection",
    "Range",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
