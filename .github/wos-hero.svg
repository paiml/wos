<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="wasm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#654ff0"/>
      <stop offset="100%" style="stop-color:#5b4ed9"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dea584"/>
      <stop offset="100%" style="stop-color:#ce7e42"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern for tech feel -->
  <g opacity="0.05">
    <path d="M0 0 L1280 0 L1280 640 L0 640 Z" fill="none" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#fff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Central microkernel core -->
  <g transform="translate(640, 260)">
    <!-- Outer ring - userspace -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>

    <!-- Middle ring - syscalls -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#wasm)" stroke-width="4" opacity="0.7"/>

    <!-- Inner core - kernel -->
    <circle cx="0" cy="0" r="50" fill="url(#kernel)" opacity="0.95"/>

    <!-- Kernel symbol - stylized K -->
    <text x="0" y="12" font-family="ui-monospace, monospace" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">K</text>

    <!-- Process nodes around kernel -->
    <g opacity="0.8">
      <!-- PID 1 - init -->
      <circle cx="0" cy="-90" r="12" fill="#22d3ee"/>
      <text x="0" y="-75" font-family="ui-monospace, monospace" font-size="10" fill="#888" text-anchor="middle">init</text>

      <!-- Shell -->
      <circle cx="78" cy="-45" r="10" fill="#22d3ee"/>
      <text x="95" y="-40" font-family="ui-monospace, monospace" font-size="10" fill="#888" text-anchor="start">sh</text>

      <!-- User process -->
      <circle cx="78" cy="45" r="10" fill="#22d3ee"/>
      <text x="95" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#888" text-anchor="start">usr</text>

      <!-- VFS -->
      <circle cx="0" cy="90" r="10" fill="#22d3ee"/>
      <text x="0" y="105" font-family="ui-monospace, monospace" font-size="10" fill="#888" text-anchor="middle">vfs</text>

      <!-- IPC -->
      <circle cx="-78" cy="45" r="10" fill="#22d3ee"/>
      <text x="-95" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#888" text-anchor="end">ipc</text>

      <!-- Memory -->
      <circle cx="-78" cy="-45" r="10" fill="#22d3ee"/>
      <text x="-95" y="-40" font-family="ui-monospace, monospace" font-size="10" fill="#888" text-anchor="end">mem</text>
    </g>

    <!-- Connection lines -->
    <g stroke="#22d3ee" stroke-width="1" opacity="0.3">
      <line x1="0" y1="-50" x2="0" y2="-78"/>
      <line x1="43" y1="-25" x2="68" y2="-40"/>
      <line x1="43" y1="25" x2="68" y2="40"/>
      <line x1="0" y1="50" x2="0" y2="78"/>
      <line x1="-43" y1="25" x2="-68" y2="40"/>
      <line x1="-43" y1="-25" x2="-68" y2="-40"/>
    </g>
  </g>

  <!-- WASM badge -->
  <g transform="translate(920, 200)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="url(#wasm)" opacity="0.9"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">WASM</text>
  </g>

  <!-- Rust badge -->
  <g transform="translate(360, 200)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="url(#rust)" opacity="0.9"/>
    <text x="0" y="6" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Rust</text>
  </g>

  <!-- Title -->
  <text x="640" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#fff" text-anchor="middle">WOS</text>
  <text x="640" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">WebAssembly Operating System</text>
  <text x="640" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Part of the Sovereign AI Stack</text>
</svg>
